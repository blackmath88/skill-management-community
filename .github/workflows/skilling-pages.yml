name: Verify Skilling Me Softly preview

on:
  push:
    branches: [ccr-cda53478-1fik71]
    paths:
      - 'workbench/apps/capability-development/app/**'
      - '.github/workflows/skilling-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skilling-me-softly-verify
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench/apps/capability-development/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/apps/capability-development/app/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, tests and production build
        run: npm run verify
      - name: Check Pages artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test ! -e dist/node_modules
          touch dist/.nojekyll
