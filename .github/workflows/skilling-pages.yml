name: Deploy Skilling Me Softly to Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/skilling-pages.yml']
  workflow_run:
    workflows: ['Verify Skilling Me Softly preview']
    types: [completed]
    branches: [ccr-cda53478-1fik71]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skilling-me-softly-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench/apps/capability-development/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || '3930a088f3a8e7020011d5673bf9242c171c880c' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/apps/capability-development/app/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, tests and production build
        run: npm run verify
      - name: Check Pages artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test ! -e dist/node_modules
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: workbench/apps/capability-development/app/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
